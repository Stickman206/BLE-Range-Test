# Project-wide Gradle settings.
# AGP 9.0 built-in Kotlin is enabled by default; no kotlin-android plugin needed.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Override user-level proxy in ~/.gradle/gradle.properties (port 7897 is down).
# Bypass proxy entirely - direct connection to Google Maven works.
systemProp.http.nonProxyHosts=*
systemProp.https.nonProxyHosts=*

# AndroidX
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete"
kotlin.code.style=official

# AGP built-in Kotlin (default in AGP 9.0) - uncomment only if you need to disable it:
# android.builtInKotlin=false

# Non-transitive R classes for faster builds
android.nonTransitiveRClass=true

# Project path contains non-ASCII characters (D:\项目\BTT) - disable AGP path check.
android.overridePathCheck=true
