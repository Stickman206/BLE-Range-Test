name: Build & Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（用于 Release tag，如 1.0.1）'
        required: false
        default: '1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 本地 wrapper 指向腾讯镜像，CI 切换为官方源（国外 runner 更稳定）
      - name: Switch to official Gradle distribution
        run: sed -i 's|https\\://mirrors.cloud.tencent.com/gradle/|https\\://services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK with version
        run: mv apk/app-debug.apk "apk/BLE-Range-Test-${{ steps.version.outputs.VERSION }}-debug.apk"

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: BLE 拉距测试 v${{ steps.version.outputs.VERSION }}
          body: |
            自动构建产物（debug 签名，可直接安装）

            - 基于最新 master 代码自动编译
            - 支持离线安装（允许未知来源）
          files: apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
